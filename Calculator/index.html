<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <script type="text/javascript" src="script.js" defer></script>
</head>

<body>
    <div class="calc">
        <div class="displayClear">
            <input id="inp" class="display" name="display" type="text" placeholder="0"></input>
            <button id="clr" type="button">Clear</button> 
        </div>
        <div class="calcButtons">
            <div id="Numbers" class="Numbers">
                <div class="numberButtonContainer">
                    <button data-value=1 id="num1" type="button">1</button> 
                    <button data-value=2 id="num2" type="button">2</button> 
                    <button data-value=3 id="num3" type="button">3</button> 
                </div>
                <div class="numberButtonContainer">
                    <button data-value=4 id="num4" type="button">4</button> 
                    <button data-value=5 id="num5" type="button">5</button> 
                    <button data-value=6 id="num6" type="button">6</button> 
                </div>
                <div class="numberButtonContainer">
                    <button data-value=7 id="num7" type="button">7</button> 
                    <button data-value=8 id="num8" type="button">8</button> 
                    <button data-value=9 id="num9" type="button">9</button> 
                </div>
                <div class="numberButtonContainer">
                    <button data-value=0 id="num0" type="button">0</button> 
                </div>
            </div>
            <div class="operations">
                <div class="operationsButtonContainer">
                    <button data-value=+ id="add" type="button">+</button> 
                    <button data-value=- id="sub" type="button">-</button> 
                </div>
                <div class="operationsButtonContainer">
                    <button data-value=* id="mult" type="button">*</button> 
                    <button data-value=/ id="divi" type="button">/</button> 
                </div>
            </div>
            <div class="bkspEqualButtonContainer">
                <div class="BkspEqual">
                    <button id="bksp" type="button">Bksp</button> 
                    <button id="equals" type="button">=</button> 
                </div>
            </div>
        </div>
    </div>
</body>
</html>
