<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <script type="text/javascript" src="script.js" defer></script>
</head>

<body>
    <div class="calc">
        <div class="displayClear">
            <input id="inp" class="display" name="display" type="text" placeholder="0"></input>
            <button id="clr" type="button">Clr</button>
        </div>
        <div class="calcButtons">
            <div class="row">
                <button data-value=1 class="number" type="button">1</button>
                <button data-value=2 class="number" type="button">2</button> 
                <button data-value=3 class="number" type="button">3</button>
                <button data-value=+ class="operation" type="button">+</button> 
            </div>
            <div class="row">
                <button data-value=4 class="number" type="button">4</button> 
                <button data-value=5 class="number" type="button">5</button> 
                <button data-value=6 class="number" type="button">6</button>
                <button data-value=- class="operation" type="button">-</button> 
            </div>
            <div class="row">
                <button data-value=7 class="number" type="button">7</button> 
                <button data-value=8 class="number" type="button">8</button> 
                <button data-value=9 class="number" type="button">9</button>
                <button data-value=* class="operation" type="button">*</button> 
            </div>
            <div class="row">
                <button data-value=0 class="number" type="button">0</button> 
                <button id="bksp" type="button">Bk</button> 
                <button id="equals" type="button">=</button> 
                <button data-value=/ class="operation" type="button">/</button> 
            </div>
        </div>
    </div>
</body>
</html>
